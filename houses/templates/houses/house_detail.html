{% extends "base.html" %}

{% block content %}

<div class="container mt-4">

    <div class="row">

        <div class="col-md-7">

            {% if house.image %}
                <img
                    src="{{ house.image.url }}"
                    class="img-fluid rounded"
                    alt="{{ house.title }}"
                >
            {% endif %}

        </div>

        <div class="col-md-5">

            <h1>{{ house.title }}</h1>

            <p class="text-muted">
                {{ house.location }}
            </p>

            <p>
                ⭐ {{ house.rating }}
            </p>

            <h3>
                {{ house.price }} € / night
            </h3>

            <hr>

            <p>
                {{ house.description }}
            </p>

        </div>

    </div>

</div>

{% endblock %}

{% extends "base.html" %}

{% block content %}

<div class="container mt-4">

    <div class="row justify-content-center">

        <div class="col-lg-7">

            <div class="card shadow-sm">

                <div class="card-body p-4">

                    <h1 class="h3 mb-1">
                        Adicionar casa
                    </h1>

                    <p class="text-muted mb-4">
                        Cadastre sua acomodação para receber hóspedes.
                    </p>

                    <form method="POST" enctype="multipart/form-data">

                        {% csrf_token %}

                        {{ form.as_p }}

                        <div class="d-flex gap-2 mt-4">

                            <a
                                href="{% url 'host' %}"
                                class="btn btn-outline-airbnb"
                            >
                                Cancelar
                            </a>

                            <button
                                type="submit"
                                class="btn btn-airbnb"
                            >
                                Salvar casa
                            </button>

                        </div>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>

{% endblock %}

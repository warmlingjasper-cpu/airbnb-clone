{% extends "base.html" %}

{% block title %}
    Login | Airbnb Clone
{% endblock %}

{% block content %}

<div class="container py-5">

    <div class="row justify-content-center">

        <div class="col-md-5">

            <div class="card shadow-sm">

                <div class="card-body p-4">

                    <h1 class="h3 text-center mb-4">
                        Entrar
                    </h1>

                    <form method="post">

                        {% csrf_token %}

                        <div class="mb-3">
                            <label for="username" class="form-label">
                                Usuário
                            </label>

                            <input
                                type="text"
                                name="username"
                                id="username"
                                class="form-control"
                                required
                            >
                        </div>

                        <div class="mb-3">
                            <label for="password" class="form-label">
                                Senha
                            </label>

                            <input
                                type="password"
                                name="password"
                                id="password"
                                class="form-control"
                                required
                            >
                        </div>

                        {% if error %}
                            <div class="alert alert-danger">
                                {{ error }}
                            </div>
                        {% endif %}

                        <button
                            type="submit"
                            class="btn btn-airbnb w-100"
                        >
                            Entrar
                        </button>

                    </form>

                    <div class="text-center mt-4">

                        <p class="text-muted mb-2">
                            Ainda não tem uma conta?
                        </p>

                        <a href="{% url 'register' %}">
                            Criar conta
                        </a>

                    </div>

                </div>

            </div>

        </div>

    </div>

</div>

{% endblock %}
